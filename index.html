@font-face{font-family:Unbounded;src:url(fonts/unbounded-cyrillic-500-normal.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Unbounded;src:url(fonts/unbounded-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}

@font-face{font-family:Onest;src:url(fonts/onest-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215}

/* Палитра как у gem-pro.ru */
:root,:root[data-theme=dark]{
 --bg:#0E0E10;--surface:#161618;--raised:#1C1C1F;--line:#2A2A2F;--line2:#34343A;
 --text:#F2F2F4;--soft:#C4C4CB;--muted:#8B8B94;--dim:#62626A;
 --accent:#FF8A3D;--accent2:#FFB36B;--ink:#1A0E05;--accentSoft:rgba(255,138,61,.13);
 --chip-bg:#2A2116;--chip:#F5C457;--green:#7FE0B2;--red:#FF6B7A;--redSoft:rgba(255,107,122,.13);--greenSoft:rgba(127,224,178,.12);
 --display:Unbounded,"Arial Black",system-ui,sans-serif;--sans:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{
 --bg:#F5F3EF;--surface:#FFFFFF;--raised:#F0EDE8;--line:#E6E1DA;--line2:#D8D2C9;
 --text:#161618;--soft:#3D3D44;--muted:#7A7882;--dim:#A3A0A8;
 --accent:#F2711C;--accent2:#FF9A4D;--ink:#FFFFFF;--accentSoft:rgba(242,113,28,.11);
 --chip-bg:#FFF1D6;--chip:#9A6A00;--green:#13985F;--red:#E0344B;--redSoft:rgba(224,52,75,.09);--greenSoft:rgba(19,152,95,.09)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font:700 20px/1.1 var(--display);letter-spacing:-.03em;margin:0}
main{padding:0 16px 112px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.card>b,.ttl{font:700 14px var(--display);letter-spacing:-.01em}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font:700 26px/1.15 var(--display);letter-spacing:-.03em;margin-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font:700 16px var(--display);letter-spacing:-.02em;text-transform:capitalize}
.ib{border:1px solid var(--line2);background:transparent;color:var(--text);width:38px;height:38px;border-radius:999px;font-size:17px;cursor:pointer;flex:none;transition:all .2s var(--ease)}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .wd{font-size:11px;color:var(--dim);padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:500;cursor:pointer;position:relative;transition:background .15s}
.day:hover{background:var(--raised)}
.day.o{opacity:.28}.day.t{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.day.s{background:var(--accent);color:var(--ink);box-shadow:0 6px 20px -6px var(--accent)}
.dots{display:flex;gap:3px;margin-top:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%}
.day small{font-size:10px;color:var(--muted);margin-top:2px;display:none}
.day.s small{color:var(--ink)}
.da{background:var(--chip)}.dz{background:var(--green)}.do{background:var(--accent2)}.dwarn{background:var(--red)!important}
.day.s .dots i{background:var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0;padding-bottom:2px}
.ico{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;background:var(--raised);border:1px solid var(--line)}
.grow{flex:1;min-width:0}.grow div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:500 15px var(--display);letter-spacing:-.02em;white-space:nowrap}.plus{color:var(--green)}.minus{color:var(--red)}
.bar{height:6px;background:var(--raised);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s var(--ease)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line2);padding:9px 16px;border-radius:999px;background:transparent;color:var(--soft);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.tab.add{border-style:dashed;color:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:76px;transition:color .2s}
nav button svg{width:22px;height:22px}nav button.on{color:var(--accent)}
nav .fab{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:28px;line-height:1;justify-content:center;box-shadow:0 8px 24px -6px var(--accent)}
nav .fab span.lbl{display:none}
nav .logo{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet-bg.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet{background:var(--surface);border:1px solid var(--line);width:100%;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s var(--ease)}
.sheet h2{margin:0 0 14px;font:700 18px/1.2 var(--display);letter-spacing:-.02em}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;transition:all .2s var(--ease)}
.seg button.on{background:var(--raised);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line2)}
.btn{width:100%;border:1px solid var(--accent);padding:14px 20px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:600;margin-top:16px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 8px 24px -10px var(--accent)}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2);box-shadow:none;margin-top:8px}
.btn.ghost:hover{border-color:var(--accent)}
.btn.del{background:none;border-color:transparent;color:var(--red);box-shadow:none;margin-top:4px}
.btn .sub{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:22px 0}
.hide{display:none!important}
.cols{display:block}
.who{display:flex;align-items:center;gap:12px}
.who b{font:700 17px var(--display);letter-spacing:-.02em}
.edit{color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.bd{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:1px}
.bd.ok{background:var(--greenSoft);color:var(--green)}.bd.wait{background:var(--chip-bg);color:var(--chip)}.bd.warn{background:var(--redSoft);color:var(--red)}.bd.rej{background:var(--raised);color:var(--muted)}
.tab .cnt{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px}
.tab.on .cnt{background:var(--ink);color:var(--accent)}
.qr{display:flex;justify-content:center;margin:14px 0}.qr img{width:220px;height:220px;image-rendering:pixelated;border-radius:16px;background:#fff;padding:10px}
.code{font:700 20px var(--display);letter-spacing:3px;text-align:center}
video{width:100%;border-radius:18px;background:#000;margin-top:12px}
.alert{background:var(--redSoft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:18px;padding:12px 14px;font-weight:600;margin-bottom:12px;cursor:pointer}
.btn.sm{padding:11px 18px;font-size:14px;margin-top:8px}
.two{display:flex;gap:8px}.two .btn{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line2);background:none;color:var(--soft);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}

/* ===== Компьютер ===== */
@media (min-width:900px){
 nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:26px 14px;border-top:0;border-right:1px solid var(--line);background:var(--surface)}
 nav .logo{display:flex;align-items:center;gap:10px;font:700 17px var(--display);letter-spacing:-.03em;padding:0 10px 22px}
 nav .logo i{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
 nav button{flex-direction:row;width:auto;font-size:15px;font-weight:500;gap:12px;padding:11px 14px;border-radius:999px;justify-content:flex-start}
 nav button svg{width:20px;height:20px}
 nav button.on{background:var(--accentSoft)}
 nav button:not(.fab):hover{background:var(--raised);color:var(--text)}
 nav .fab{order:9;width:auto;height:auto;border-radius:999px;font-size:15px;font-weight:600;padding:13px;margin-top:14px;justify-content:center}
 nav .fab span.lbl{display:inline}
 header{margin-left:232px;padding:26px 36px 14px}
 header h1{font-size:28px}
 main{margin-left:232px;padding:0 36px 40px;max-width:1320px}
 .cols{display:grid;grid-template-columns:minmax(390px,1.15fr) 1fr;gap:16px;align-items:start}
 .card{padding:20px;margin-bottom:16px}
 .day{aspect-ratio:auto;min-height:64px}
 .day small{display:block}
 .tabs{margin:0;padding:2px 0 14px;flex-wrap:wrap}
 .sheet-bg{align-items:center}
 .sheet{max-width:460px;border-radius:26px;padding:24px}
 .sticky{position:sticky;top:90px}
}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><button class="ib" id="themeBtn" aria-label="theme">🌙</button></header>
<main>
 <div id="tabsWrap" class="hide"><div class="tabs" id="tabs"></div></div>
 <section id="pCal">

    <div class="card" id="whoCard" style="display:none"><div class="who"><div class="ico">👤</div><div class="grow"><b id="whoName"></b><div class="muted" id="whoSum"></div></div><span class="edit" id="editTab" data-t="edit"></span></div></div>
    <div class="card">
     <div class="mnav"><button class="ib" id="prev">‹</button><b id="mName"></b><button class="ib" id="next">›</button></div>

     <button class="btn ghost" id="impBtn" data-t="restore"></button><input type="file" id="imp" accept=".json" class="hide">
    </div>
   </div>
  </div>
 </section>
</main>
<nav>
 <div class="logo"><i>₽</i><span data-t="appName"></span></div>
 <button data-p="main" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="salary"></span></button>
 <button class="fab" id="fab">+<span class="lbl">&nbsp;<span data-t="add"></span></span></button>

 <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings"></span></button>
</nav>

<script>
const K='moneyApp_v1';
let D={incomes:[],ledgers:[],theme:'dark'};
const $=id=>document.getElementById(id);
function migrate(o){o.ledgers=o.ledgers||[];o.incomes=o.incomes||[];
 o.ledgers.forEach(l=>{l.entries=(l.entries||[]).map(e=>e.type?e:{id:e.id,type:'o',amount:e.amount,date:e.date,note:[e.dir==='in'?'← '+e.who:e.who,e.note].filter(Boolean).join(' · ')})});
 if(o.ledgers.length===1&&o.ledgers[0].name==='Общий'&&!o.ledgers[0].entries.length)o.ledgers=[];
 return o}
try{const s=localStorage.getItem(K);if(s)D=migrate(Object.assign(D,JSON.parse(s)))}catch(e){}

/* ===== язык ===== */
const LOC={ru:'ru-RU',en:'en-GB',uz:'uz-Latn-UZ',kk:'kk-KZ',uk:'uk-UA',tr:'tr-TR',de:'de-DE',es:'es-ES'};
if(!D.lang){const n=(navigator.language||'ru').slice(0,2);D.lang=LANGS[n]?n:'ru'}
const t=(k,p)=>{let s=(LANGS[D.lang]||LANGS.ru)[k];if(s==null)s=LANGS.ru[k]||k;if(p)for(const x in p)s=s.split('{'+x+'}').join(p[x]);return s};
const loc=()=>LOC[D.lang]||'ru-RU';

 j=await r.json().catch(()=>({error:'Нет связи с сервером'}));
 if(r.status===401&&D.acct&&path!=='/login'){D.acct=null;save();render()}
 if(!r.ok)throw new Error(errT(j.error||'Ошибка сервера'));return j}

 const tot=sum(),av=sum('a'),zp=sum('z');
 $('mLbl').textContent=t(isLed?(lk?(side==='in'?'monthGot':'monthSent'):'monthGiven'):'monthIn');
 $('mTotal').textContent=fmt(tot);$('mAv').textContent=t('adv')+': '+fmt(av);$('mZp').textContent=t('sal')+': '+fmt(zp);
 $('mBar').style.width=(tot?Math.round(av/tot*100):0)+'%';
 $('yTotal').textContent=t('forYear',{y,v:fmt(E.filter(x=>x.date.startsWith(y+'-')&&!x.rejected&&(!lk||x.dir===side)).reduce((a,x)=>a+x.amount,0))});
 $('dTitle').textContent=dayTitle(sel);
 const row=x=>{const inn=!isLed||(lk&&x.dir==='in'),cls=lk?(x.dir==='in'?'plus':'minus'):(isLed?'':'plus');
  return `<div class="item" data-id="${x.id}"><div class="ico">${lk?(x.dir==='in'?'↙':'↗'):TYPES[x.type].i}</div><div class="grow"><div>${tn(x.type)}${lk?`<span class="bd ${x.st}">${t(x.lk)}</span>`:''}</div><div class="muted">${fd(x.date)}${lk?' · '+t(x.dir==='in'?'gotW':'sentW'):''}${x.note?' · '+esc(x.note):''}</div></div><div class="amt ${cls}" style="${x.rejected?'text-decoration:line-through;opacity:.5':''}">${inn&&(lk||!isLed)?'+':(lk?'−':'')}${fmt(x.amount)}</div></div>`};
 const di=E.filter(x=>x.date===sel);
 $('dList').innerHTML=di.length?di.map(row).join(''):`<div class="empty">${t('emptyDay')}</div>`;
 $('mList').innerHTML=mi.length?[...mi].sort((a,b)=>a.date.localeCompare(b.date)).map(row).join(''):`<div class="empty">${t('emptyMonth')}</div>`;

async function showQR(){
 $('qBody').innerHTML=`<div class="empty">${t('creating')}</div>`;
 try{const [{code}]=await Promise.all([api('/invite','POST'),loadJs('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js')]);
  const url=location.origin+location.pathname+'#inv='+code,q=qrcode(0,'M');q.addData(url);q.make();
  $('qBody').innerHTML=`<div class="qr">${q.createImgTag(6,0)}</div><div class="code">${code.match(/.{1,4}/g).join(' ')}</div>
  <div class="muted" style="text-align:center;margin-top:10px">${t('qrHint')}</div>`;
  const wait=setInterval(async()=>{if(!$('qBody')||!$('sb').classList.contains('on')){clearInterval(wait);return}const n=D.sync.links.length;await sync();if(D.sync.links.length>n){clearInterval(wait);const k=D.sync.links[D.sync.links.length-1];led='L:'+k.id;close();alert(t('linked',{n:oname(k)}));go('led')}},4000);
 }catch(e){$('qBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function scanQR(){
 $('qBody').innerHTML=`<video id="cam" playsinline muted></video><div class="muted" style="margin-top:8px">${t('camHint')}</div>
 <label>${t('orCode')}</label><div class="two"><input id="mCode" placeholder="XXXX XXXX XXXX" style="text-transform:uppercase"><button class="btn sm" id="mGo" style="width:auto;margin-top:0">OK</button></div>`;
 $('mGo').onclick=()=>doLink($('mCode').value.replace(/\s/g,''));
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('cam');v.srcObject=stream;await v.play();
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det)await loadJs('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js');
  const c=document.createElement('canvas'),g=c.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(!stream)return;let txt=null;
   if(v.readyState>=2){if(det){const r=await det.detect(v).catch(()=>[]);if(r[0])txt=r[0].rawValue}
    else{c.width=v.videoWidth;c.height=v.videoHeight;g.drawImage(v,0,0);const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)txt=r.data}}
   const m=txt&&txt.match(/inv=([0-9A-F]{12})/i)||txt&&txt.match(/^([0-9A-F]{12})$/i);
   if(m){stopCam();return doLink(m[1])}setTimeout(tick,250)};tick();
 }catch(e){const v=$('cam');if(v)v.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:t('camNo')}))}}
const doLink=net(async code=>{if(!code)return;const r=await api('/link','POST',{code});await sync();led='L:'+r.linkId;stopCam();close();
 const k=D.sync.links.find(x=>x.id===r.linkId);alert(r.existed?t('already'):t('linked',{n:k?oname(k):t('someone')}));go('led')});

function accountSheet(msg,then){
 open(`<h2>${t('account')}</h2>${msg?`<div class="muted" style="margin-bottom:10px">${msg}</div>`:''}
 <div class="seg" id="aMode" data-v="login"><button data-v="login" class="on">${t('signIn')}</button><button data-v="reg">${t('signUp')}</button></div>
 <label>${t('loginLbl')}</label><input id="aU" autocomplete="username" autocapitalize="none" placeholder="${t('loginPh')}">
 <div id="aNameW" class="hide"><label>${t('shownName')}</label><input id="aN" placeholder="${t('namePh2')}"></div>
 <label>${t('password')}</label><input id="aP" type="password" autocomplete="current-password" placeholder="${t('pwPh')}">
 <button class="btn" id="aGo">${t('doLogin')}</button>`);
 segInit('aMode');$('aMode').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const r=b.dataset.v==='reg';$('aNameW').classList.toggle('hide',!r);$('aGo').textContent=t(r?'doReg':'doLogin')}));
 $('aGo').onclick=net(async()=>{const reg=$('aMode').dataset.v==='reg';
  const j=await api(reg?'/register':'/login','POST',{username:$('aU').value,password:$('aP').value,name:reg?$('aN').value:undefined});
  D.acct={token:j.token,user:j.user};save();close();await sync();render();if(then)then()})}

function tabForm(l,local){if(!l&&!local)return newTabSheet();
 open(`<h2>${t(l?'tab':'newTab')}</h2><label>${t('nameLbl')}</label><input id="tN" value="${l?esc(l.name):''}" placeholder="${t('namePh')}">
 <button class="btn" id="tS">${t('save')}</button>${l?`<button class="btn del" id="tX">${t('delTab')}</button>`:''}`);
 $('tS').onclick=()=>{const n=$('tN').value.trim();if(!n)return;if(l)l.name=n;else{const o={id:uid(),name:n,entries:[]};D.ledgers.push(o);led=o.id}save();close();if(page!=='led')go('led');else render()};
 if(l)$('tX').onclick=()=>{if(confirm(t('delTabQ',{n:l.name}))){D.ledgers.splice(D.ledgers.indexOf(l),1);led=D.ledgers[0]&&D.ledgers[0].id;save();close();render()}}}

/* ===== резервная копия ===== */
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(Object.assign({},D,{acct:null,sync:undefined}),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-backup-'+iso(new Date())+'.json';a.click()};
$('impBtn').onclick=()=>$('imp').click();
$('imp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.incomes||!o.ledgers)throw 0;if(confirm(t('replaceQ'))){const keep={acct:D.acct,sync:D.sync};D=Object.assign(migrate(o),keep);led=D.ledgers[0]&&D.ledgers[0].id;save();applyTheme();applyLang();render()}}catch(e){alert(t('badFile'))}};r.readAsText(f);ev.target.value=''};

/* ===== настройки ===== */
function renderSettings(){
 $('langChips').innerHTML=Object.keys(LANGS).map(k=>`<button data-v="${k}" class="${k===D.lang?'on':''}">${LANGS[k]._name}</button>`).join('');
 $('langChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{D.lang=b.dataset.v;save();applyLang();render()});
 $('curChips').innerHTML=CUR.map(k=>`<button data-v="${k}" class="${k===D.cur?'on':''}">${curLabel(k)}</button>`).join('');
 $('curChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{D.cur=b.dataset.v;save();render()});
 const u=me();
 $('acctCard').innerHTML=u?`<b>${t('account')}</b><div class="row" style="margin-top:10px"><div class="who"><div class="ico">👤</div><div><div style="font-weight:600">${esc(u.name)}</div><div class="muted">@${esc(u.username)}</div></div></div><button class="ib" id="aOut" style="width:auto;padding:0 14px;font-size:14px">${t('logout')}</button></div><button class="btn ghost" id="aLink">${t('linkTab')}</button>`
  :`<b>${t('account')}</b><div class="muted" style="margin-top:6px">${t('acctDesc')}</div><button class="btn" id="aIn">${t('signBtn')}</button>`;
 if(u){$('aOut').onclick=()=>{if(!confirm(t('logoutQ')))return;api('/logout','POST').catch(()=>{});D.acct=null;D.sync={links:[]};save();render()};$('aLink').onclick=linkSheet}
 else $('aIn').onclick=()=>accountSheet();
 showSaved()}
function render(){$('ttl').textContent=t(TT[page]);
 $('pSet').classList.toggle('hide',page!=='set');$('pCal').classList.toggle('hide',page==='set');
 if(page==='set'){$('tabsWrap').classList.add('hide');renderSettings()}else renderCal()}

(function(){let has=false;try{has=!!localStorage.getItem(K)}catch(e){}
 if(!has)idb().then(db=>{const r=db.transaction('b').objectStore('b').get('last');r.onsuccess=()=>{if(r.result){try{D=migrate(Object.assign(D,JSON.parse(r.result)));led=D.ledgers[0]&&D.ledgers[0].id;try{localStorage.setItem(K,r.result)}catch(e){}applyTheme();applyLang();render()}catch(e){}}}}).catch(()=>{})})();
applyTheme();applyLang();render();sync();
(function(){const m=location.hash.match(/inv=([0-9A-F]{12})/i);if(!m)return;history.replaceState(null,'',location.pathname);
 const code=m[1];if(me())doLink(code);else accountSheet(t('loginToLink'),()=>doLink(code))})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
